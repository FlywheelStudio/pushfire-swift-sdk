name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Lint
        run: xcrun swift-format lint --recursive --strict Sources Tests
      - name: Build
        run: xcodebuild build -scheme PushFire-Package -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
      - name: Test
        run: xcodebuild test -scheme PushFire-Package -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
